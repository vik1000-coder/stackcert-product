[project]
name = "stackcert-prototype"
version = "0.1.0"
description = "Isolated StackCert prototype for guardrail-stack assurance."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.8.0",
  "mcp>=1.22.0",
  "sentry-sdk[fastapi]>=2.0.0",
]

[tool.setuptools.packages.find]
include = ["stackcert*", "stackcert_service*"]

[tool.pytest.ini_options]
pythonpath = ["."]
