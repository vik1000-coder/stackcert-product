<text x="694" y="424" class="label" text-anchor="start">Lambda 5 selected pair:</text>
<text x="694" y="449" class="small" text-anchor="start">low adversarial miss is worth</text>
<text x="694" y="468" class="small" text-anchor="start">some benign friction</text>
<text x="46" y="610" class="subtitle" text-anchor="start">Message: the theory is about welfare under a penalty, not raw model strength; the selected pair moves to the safety-favorable region.</text>
</svg>
