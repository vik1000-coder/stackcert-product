<text x="46" y="48" class="title" text-anchor="start">Tradeoff view: high benign pass-through is not enough</text>
<text x="46" y="76" class="subtitle" text-anchor="start">Qwen3 8B preserves benign pass-through but leaves more adversarial misses; the lambda 5 CASS pair sharply reduces adversarial miss-through.</text>
