name: nightly

on:
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

jobs:
  golden-core:
    name: golden core replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run core tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Placeholder for full golden replay
        run: |
          echo "Add full certificate replay once demo artifacts are checked into or fetched by CI."

