name: deploy pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: test and build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s tests_service -p 'test_*.py' -v

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck and test frontend
        working-directory: web
        run: |
          npm run typecheck
          npm test -- --run

      - name: Build frontend for GitHub Pages
        working-directory: web
        env:
          VITE_ROUTER_MODE: hash
          VITE_PUBLIC_BASE: /${{ github.event.repository.name }}/
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Add Pages metadata
        run: touch web/dist/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    name: deployed smoke test
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Smoke deployed Pages app and Supabase API
        env:
          STACKCERT_SMOKE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          python scripts/deployment_smoke.py \
            --web-url "${{ needs.deploy.outputs.page_url }}" \
            --api-url "${{ vars.VITE_API_BASE_URL }}" \
            --supabase-url "${{ vars.VITE_SUPABASE_URL }}" \
            --email "${{ secrets.STACKCERT_SMOKE_EMAIL }}" \
            --password "${{ secrets.STACKCERT_SMOKE_PASSWORD }}"
